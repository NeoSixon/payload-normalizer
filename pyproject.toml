[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payload-normalizer"
version = "0.1.0"
description = "Small utilities for normalizing metadata fields from API payloads."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "NeoSixon" }
]

[tool.setuptools]
packages = ["payload_normalizer"]
